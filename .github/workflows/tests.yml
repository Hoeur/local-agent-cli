name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
        extra: ["", "[tui]"]
        include:
          - os: windows-latest
            python: "3.11"
            extra: "[tui,hologram-image]"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".${{ matrix.extra }}"
      - name: Test
        run: python -m unittest discover -s tests -v

  wheel-workflow:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist
          python scripts/release_check.py
      - name: Install the wheel into a clean environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          py="$RUNNER_TEMP/clean/bin/python"
          [ -x "$py" ] || py="$RUNNER_TEMP/clean/Scripts/python.exe"
          "$py" -m pip install "$(ls dist/*.whl)[tui]"
          echo "CLEAN_PY=$py" >> "$GITHUB_ENV"
      - name: Run the coding workflow against the installed wheel
        shell: bash
        working-directory: ${{ runner.temp }}
        run: '"$CLEAN_PY" -I "$GITHUB_WORKSPACE/scripts/workflow_check.py"'
